name: Validate Video Studio

on:
  pull_request:
    paths:
      - "video.html"
      - "js/video.js"
      - "js/video-player.js"
      - "css/video.css"
      - "service-worker.js"
      - "scripts/**"
      - ".github/workflows/validate-video.yml"
  push:
    branches:
      - main
      - feature/euron-player-integration
    paths:
      - "video.html"
      - "js/video.js"
      - "js/video-player.js"
      - "css/video.css"
      - "service-worker.js"
      - "scripts/**"
      - ".github/workflows/validate-video.yml"

permissions:
  contents: read

jobs:
  syntax-check:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check video controller syntax
        run: node --check js/video.js
      - name: Check video player syntax
        run: node --check js/video-player.js
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Run Video Studio structural smoke test
        run: node scripts/check-video-studio.mjs
