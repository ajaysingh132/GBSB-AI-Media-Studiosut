name: Validate Video Studio

on:
  pull_request:
    paths:
      - "video.html"
      - "projects.html"
      - "storyboard.html"
      - "ai-video.html"
      - "ai-music.html"
      - "js/ai-music.js"
      - "css/ai-music.css"
      - "js/storyboard.js"
      - "js/ai-video.js"
      - "css/storyboard.css"
      - "css/ai-video.css"
      - "js/projects.js"
      - "css/projects.css"
      - "js/video.js"
      - "js/video-player.js"
      - "css/video.css"
      - "service-worker.js"
      - "backend/**/*.py"
      - "scripts/**"
      - ".github/workflows/validate-video.yml"
  push:
    branches:
      - main
      - feature/euron-player-integration
    paths:
      - "video.html"
      - "projects.html"
      - "storyboard.html"
      - "ai-video.html"
      - "js/storyboard.js"
      - "js/ai-video.js"
      - "css/storyboard.css"
      - "css/ai-video.css"
      - "js/projects.js"
      - "css/projects.css"
      - "js/video.js"
      - "js/video-player.js"
      - "css/video.css"
      - "service-worker.js"
      - "scripts/**"
      - ".github/workflows/validate-video.yml"

permissions:
  contents: read

jobs:
  syntax-check:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check video controller syntax
        run: node --check js/video.js
      - name: Check projects controller syntax
        run: node --check js/projects.js
      - name: Check storyboard controller syntax
        run: node --check js/storyboard.js
      - name: Check AI Video Engine syntax
        run: node --check js/ai-video.js
      - name: Check AI Music Engine syntax
        run: node --check js/ai-music.js
      - name: Check video player syntax
        run: node --check js/video-player.js
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Check Python backend syntax
        run: python -m py_compile backend/app/main.py backend/app/providers/gemini_music.py
      - name: Run Video Studio structural smoke test
        run: node scripts/check-video-studio.mjs
